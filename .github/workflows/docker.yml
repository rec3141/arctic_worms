name: docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load into local docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: arctic_worms:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the RAxML/pplacer pipeline
        run: |
          docker run --rm arctic_worms:ci bash -c '
            set -e
            cd /arctic_worms
            scripts/run_pipeline.sh /tmp/macro \
              data/sequences/macrostomorpha_references.fas \
              data/sequences/catenulida_outgroups.fasta \
              data/sequences/amplicons_platyhelminthes.fasta \
              /dev/null 2
            test -s /tmp/macro/tog.nwk && test -s /tmp/macro/placements.csv
            echo "SMOKE TEST PASSED: $(grep -o ">" /tmp/macro/deduped.fasta | wc -l) refs, tree + placements produced"'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
